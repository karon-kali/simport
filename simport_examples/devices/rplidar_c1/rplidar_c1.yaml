# A Slamtec RPLIDAR C1 on a serial port (460800 baud), so its unmodified driver runs against
# it: Slamtec's rplidar_ros (ros2 branch) with serial_port:=/tmp/simport/rplidar_c1.
#
# Its answers were recorded from a real C1 (firmware 1.01): two scan modes, Standard
# (5-byte samples) and DenseBoost (84-byte capsules of 40 distances, the C1's default),
# about 480 samples per revolution at 10 Hz. behavior.py next to this file answers the
# driver's requests, and between a scan command and STOP publishes the scan, resampled to
# the C1's 480 clockwise beams, on /rplidar_c1/scan_standard or /rplidar_c1/scan_dense.
device: rplidar_c1
port:
  serial: /tmp/simport/rplidar_c1
  baud: 460800
  max_delay: 0.3

# Requests: A5 cmd (commands below 0x80), or A5 cmd size payload xor (0x80 and above).
framer:
  plugin: simport/SyncLength
  sync: [0xA5]
  cases:
    - when: { offset: 1, mask: 0x80, equals: 0x00 }
      size: 2
    - length: { offset: 2 }
      adjust: 4

send:
  # Standard mode: one 5-byte sample per beam. Beam k is at k * 0.75 degrees (48 in 1/64 deg).
  - name: scan_standard
    from: { topic: /rplidar_c1/scan_standard, type: sensor_msgs/msg/LaserScan }
    frames: auto
    fields:
      - group:
          count: 1
          fields:
            - flags: { u8, bits: [start: { width: 1, first_element: [1, 0] },
                                  not_start: { width: 1, first_element: [0, 1] },
                                  quality: { width: 6, from: intensities }] }
            - angle: { u16, bits: [check: { width: 1, value: 1 },
                                   angle_q6: { width: 15, element_index: { scale: 48 } }] }
            - dist_q2: { u16, from: ranges, scale: 4000.0, nonfinite: 0 }

  # DenseBoost: capsules of 40 distances in mm. Capsule n starts at n * 30 degrees; the XOR of
  # bytes 2..83 is split into the low nibbles of bytes 0 and 1, beside the sync nibbles.
  - name: scan_dense
    from: { topic: /rplidar_c1/scan_dense, type: sensor_msgs/msg/LaserScan }
    endian: little
    frames: auto
    fields:
      - sync1: { u8, bits: [cs_low: { width: 4, checksum: xor8, over: [start, distance] },
                            sync_a: { width: 4, value: 0xA }] }
      - sync2: { u8, bits: [cs_high: { width: 4, checksum: xor8, checksum_bit: 4,
                                       over: [start, distance] },
                            sync_5: { width: 4, value: 0x5 }] }
      - start: { u16, bits: [start_angle_q6: { width: 15, frame_index: { scale: 1920 } },
                             new_scan: { width: 1, value: 0 }] }
      - group:
          count: 40
          fields:
            - distance: { u16, from: ranges, scale: 1000.0, nonfinite: 0 }

  # Answers: A5 5A, then size (30 bits) and send mode (2 bits) as a u32, the answer type, data.
  - name: answer          # a single answer; the size is that of the data
    fields:
      - sync: { bytes: [0xA5, 0x5A] }
      - size_mode: { u32, bits: [size: { width: 30, length_of: data },
                                 mode: { width: 2, value: 0 }] }
      - type: u8
      - data: bytes

  - name: stream_start    # opens a stream of `size`-byte samples or capsules
    fields:
      - sync: { bytes: [0xA5, 0x5A] }
      - size_mode: { u32, bits: [size: 30, mode: { width: 2, value: 1 }] }
      - type: u8

  - name: banner          # what the C1 prints after RESET
    fields:
      - text: { bytes: [0x52, 0x50, 0x20, 0x53, 0x32, 0x20, 0x4C, 0x49, 0x44, 0x41, 0x52, 0x20,
                        0x53, 0x79, 0x73, 0x74, 0x65, 0x6D, 0x2E, 0x0D, 0x0A] }   # "RP S2 LIDAR System.\r\n"

receive:
  - name: command         # A5 cmd
    fields: [sync: { u8: 0xA5 }, cmd: u8]
    to: { service: /rplidar_c1/request }
    reply: [answer, stream_start, banner]

  - name: command_with_data   # A5 cmd size payload xor
    fields:
      - sync: { u8: 0xA5 }
      - cmd: u8
      - size: { u8, length_of: payload }
      - payload: bytes
      - xor: { u8, checksum: xor8 }
    to: { service: /rplidar_c1/request }
    reply: [answer, stream_start]
